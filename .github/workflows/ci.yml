name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 构建与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 设置 Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Android 单元测试与 Debug 构建
        timeout-minutes: 25
        run: ANDROID_HOME="$ANDROID_SDK_ROOT" ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: companion 测试
        timeout-minutes: 10
        working-directory: companion
        run: |
          npm ci
          npm test
